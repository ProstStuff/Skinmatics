plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	mavenCentral()

	maven {
		url = "https://api.modrinth.com/maven"
	}

	maven {
		name = "Terraformers"
		url = "https://maven.terraformersmc.com/"
	}

	maven {
		name = "Gegy"
		url = uri("https://maven.gegy.dev")
	}

	maven {
		url = "https://pkgs.dev.azure.com/djtheredstoner/DevAuth/_packaging/public/maven/v1"
	}
}

loom {
	accessWidenerPath = file("src/main/resources/skinmatics.classtweaker")
}

dependencies {
	minecraft "com.mojang:minecraft:${minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${loader_version}"

	implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
	implementation "com.terraformersmc:modmenu:${modmenu_version}"
	implementation "dev.lambdaurora.lambdynamiclights:lambdynamiclights-api:${dynamiclights_version}"
	implementation "maven.modrinth:iris:${iris_version}"

	runtimeOnly "maven.modrinth:sodium:${sodium_version}"
	runtimeOnly "dev.lambdaurora.lambdynamiclights:lambdynamiclights-runtime:${dynamiclights_version}"
	runtimeOnly "me.djtheredstoner:DevAuth-fabric:${devauth_version}"

	implementation files("lib/utilitary-${utilitary_version}.jar") // JitPack broken :(
	implementation "de.marhali:json5-java:${json5_version}"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE.md") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}
	repositories {

	}
}