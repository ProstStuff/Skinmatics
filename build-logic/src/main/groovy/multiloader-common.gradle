plugins {
    id 'java-library'
    id 'maven-publish'
}

base {
    archivesName = "${mod_id}"
}

repositories {
    mavenLocal()

    maven {
        name = "Gegy"
        url = uri("https://maven.gegy.dev")
    }

    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }

        filter {
            includeGroup "maven.modrinth"
        }
    }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
    withSourcesJar()
    withJavadocJar()
}

tasks.named('sourcesJar') {
    enabled = false
}

tasks.named('javadocJar') {
    enabled = false
}

tasks.withType(Jar).configureEach {
    from(rootProject.file('LICENSE.md')) {
        rename { "${it}_${mod_name}" }
    }
}

tasks.named('jar', Jar) {
    archiveFileName.set("${mod_id}-${version}+${minecraft_compatability_version}-${project.name}.jar")
}

jar {

    manifest {
        attributes([
                'Specification-Title'   : mod_name,
                'Specification-Vendor'  : mod_author,
                'Specification-Version' : project.jar.archiveVersion,
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor' : mod_author,
                'Built-On-Minecraft'    : minecraft_version
        ])
    }
}

processResources {
    var expandProps = [
            'version'                      : version,
            'group'                        : project.group,
            'minecraft_version'            : minecraft_compatability_version,
            'minecraft_version_range'      : minecraft_version_range,
            'fabric_version'               : fabric_version,
            'fabric_loader_version'        : fabric_loader_version,
            'mod_name'                     : mod_name,
            'mod_author'                   : mod_author,
            'mod_id'                       : mod_id,
            'license'                      : license,
            'description'                  : project.description,
            'neoforge_version'             : neoforge_version,
            'neoforge_loader_version_range': neoforge_loader_version_range,
            'java_version'                 : java_version,

            'iris_version': iris_version,
            'sodium_version': sodium_version,
            'utilitary_version': utilitary_version,
            'utilitary_file_version': utilitary_file_version,
            'json5_version': json5_version,
            'dynalight_version': dynalight_version,

            'modmenu_version': modmenu_version,
    ]

    var jsonExpandProps = expandProps.collectEntries {
        key, value -> [(key): value instanceof String ? value.replace('\n', '\\\\n') : value]
    }

    filesMatching(['META-INF/mods.toml', 'META-INF/neoforge.mods.toml']) {
        expand expandProps
    }

    filesMatching(['pack.mcmeta', 'fabric.mod.json', '*.mixins.json']) {
        expand jsonExpandProps
    }

    inputs.properties(expandProps)
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            groupId = "${groupId}"
            artifactId = "${mod_id}-${project.name}"
            version = "${version}+${minecraft_version}"
            from components.java
        }
    }
    repositories {
        maven {
            url System.getenv('local_maven_url')
        }
    }
}
