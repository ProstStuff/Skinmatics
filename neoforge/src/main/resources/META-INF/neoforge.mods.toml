modLoader = "javafml"
loaderVersion = "${neoforge_loader_version_range}"
license = "${license}"
issueTrackerURL="https://github.com/ProstStuff/Skinmatics/issues"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
displayURL="https://fraynn.pages.dev/projects/skinmatics"
iconFile="assets/${mod_id}/textures/icon.png"
logoBlur=false
authors = "${mod_author}"
description = '''${description}'''

[modproperties."${mod_id}"."yumi:entrypoints"]
"lambdynlights:initializer" = "com.fraynn.skinmatics.compat.SkinmaticsDynamicLights"

[[mixins]]
config = "${mod_id}.mixins.json"
[[mixins]]
config = "${mod_id}.neoforge.mixins.json"

[[dependencies.${mod_id}]]
modId = "neoforge"
type="required"
versionRange = "[${neoforge_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type="required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "utilitary"
type="required"
versionRange = "[${utilitary_version},)"
ordering = "AFTER"
side = "BOTH"